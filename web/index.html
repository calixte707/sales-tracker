<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="銷售記錄小助手 - 香水銷售管理 PWA">

  <!-- PWA & iOS Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="銷售記錄">
  <meta name="theme-color" content="#8B6F5E">
  <meta name="msapplication-TileColor" content="#8B6F5E">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/Icon-192.png">

  <!-- iOS Splash Screen (prevents white flash) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Standard Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png">
  <link rel="shortcut icon" href="favicon.png"/>

  <title>銷售記錄小助手</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF7F4;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    /* Loading screen */
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #FAF7F4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #loading .icon {
      width: 80px; height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8B6F5E, #A0836E);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(139,111,94,0.35);
    }
    #loading .icon svg {
      width: 44px; height: 44px; fill: white;
    }
    #loading h2 {
      color: #3E2723;
      font-family: -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px 0;
    }
    #loading p {
      color: #8B6F5E;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      margin: 0 0 28px 0;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #E8DDD8;
      border-top-color: #8B6F5E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Splash loading screen -->
  <div id="loading">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
      </svg>
    </div>
    <h2>銷售記錄小助手</h2>
    <p>Sales Tracker</p>
    <div class="spinner"></div>
  </div>

  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s';
        setTimeout(function() { loading.remove(); }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
